apiVersion: apps/v1
kind: Deployment
metadata:
  name: isinv-front
  namespace: isinv
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: isinv-front
  template:
    metadata:
      labels:
        app: isinv-front
    spec:
      nodeSelector:
        doks.digitalocean.com/node-pool: main
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: isinv-front
          image: ghcr.io/oak06/isinv-front:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: isinv-env
          # No resource requests or limits on purpose: the NODE is the budget.
          # Every pod grabs what it actually uses and shares the node freely; capacity
          # is managed by watching the node (kubectl top nodes) and upgrading the
          # DigitalOcean node when it gets tight — not by per-pod reservations/ceilings.
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      imagePullSecrets:
        - name: github
